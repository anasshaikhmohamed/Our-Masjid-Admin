kind = "web"
previewPath = "/admin-panel/"
title = "Our Masjid Admin"
description = "A separate role-protected operations panel for managing Our Masjid content, publishing state, fundraising projects, media, documents, and audit activity."
version = "1.0.0"
id = "artifacts/admin-panel"
router = "path"

[[services]]
name = "web"
paths = [ "/admin-panel/" ]
localPort = 20130

[services.development]
run = "pnpm --filter @workspace/admin-panel run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/admin-panel", "run", "build" ]
serve = "static"
publicDir = "artifacts/admin-panel/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20130"
BASE_PATH = "/admin-panel/"
